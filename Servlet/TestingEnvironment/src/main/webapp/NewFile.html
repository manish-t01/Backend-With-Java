<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My First Web App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        .box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hello World!</h1>

        <p>This is my first Java web application.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>
    </div>


    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello! JavaScript is working. 😊";
        }
    </script>

</body>
</html>
